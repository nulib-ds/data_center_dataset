[project]
name = "data-center-dataset"
version = "0.1.0"
description = "Reproducible dataset of commercial data centers in California with tiered power estimates"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Aerith Netzer", email = "aerith.netzer@northwestern.edu" }
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pandera>=0.20",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "selectolax>=0.3.21",
    "zipfile-deflate64>=0.2.0",
    "plotly>=6.9.0",
    "matplotlib>=3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "zipfile-deflate64>=0.2.0",
]

[project.scripts]
data-center-dataset = "data_center_dataset.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
